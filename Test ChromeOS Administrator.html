<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d9dde7;--ac:#3559e0;--ok:#16794a;--okb:#e3f6ec;--ko:#b42318;--kob:#fde8e6;--hl:#eef2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mut:#9aa3b5;--bd:#30374a;--ac:#8aa4ff;--ok:#5fd39b;--okb:#12362a;--ko:#ff8a80;--kob:#3b1c1a;--hl:#222a44;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mut:#9aa3b5;--bd:#30374a;--ac:#8aa4ff;--ok:#5fd39b;--okb:#12362a;--ko:#ff8a80;--kob:#3b1c1a;--hl:#222a44;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.hd{max-width:760px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:1.05rem;margin:0;flex:1 1 200px}
.st{font-size:.9rem;color:var(--mut)}.st b{color:var(--tx)}

button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.45;cursor:default}
.bar{height:4px;background:var(--bd);margin-top:8px;border-radius:2px;overflow:hidden;max-width:760px;margin-inline:auto}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
main{max-width:760px;margin:16px auto;padding:0 12px 40px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.q h2{font-size:1rem;margin:0 0 12px;font-weight:600}.q h2 span{color:var(--ac);margin-right:6px}
.tag{display:inline-block;font-size:.75rem;color:var(--mut);border:1px solid var(--bd);border-radius:999px;padding:0 8px;margin-left:6px;font-weight:400}
.o{display:flex;gap:10px;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;align-items:flex-start;background:var(--card)}
.o:hover:not(:disabled){background:var(--hl)}.o.sel{background:var(--hl);border-color:var(--ac)}
.o b{flex:0 0 1.4em;color:var(--mut)}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.ko{background:var(--kob);border-color:var(--ko)}
.o:disabled{opacity:1;cursor:default;color:var(--tx)}
.fb{margin-top:8px;font-size:.92rem;font-weight:600}.fb.ok{color:var(--ok)}.fb.ko{color:var(--ko)}.fb.na{color:var(--mut);font-weight:400}
.end{text-align:center;font-weight:600;padding:20px}

<script type="application/json" id="d">[{"q": "The finance team for an organization buys a new printer to print sensitive documents without using the main office printer. How should you automatically configure the printer for finance team users?", "o": [["Deploy the printer via Groups", true], ["Plug the new printer directly into the router", false], ["Add the printer directly to the user", false], ["Deploy correct drivers to the finance devices", false]], "need": 1}, {"q": "You are setting up a proof of concept using an email-verified trial environment rather than a domain-verified one. After trying to integrate with their existing third-party Identity Provider (IdP) to provision their user accounts your encounter an error. What would be the most likely reason for this?", "o": [["You need to purchase Google Workspace licenses to be able to integrate with third party IdPs.", false], ["You are only able to manage devices in an email-verified domain, not users.", false], ["Email-verified domain environment only allo for a single managed user per domain.", false], ["You need to verify a domain in order to integrate with third party IdPs.", true]], "need": 1}, {"q": "A global organization is deploying ChromeOS devices to all of their users. Corporate policy requires all web traffic to be filtered using an existing enterprise solution such that employees cannot access 1 million unauthorized websites. What should you configure to meet this requirement?", "o": [["A user policy enforcing the use of a web proxy.", true], ["A firewall rule to blocklist the URLs", false], ["A “Network access control deny” policy to blocklist the URLs.", false], ["A user policy to blocklist the URLs", false]], "need": 1}, {"q": "Your leadership team would like to verify that all ChromeOS devices are restarted to apply the new update as quickly as possible. You have 2000 devices and your Admin console is configured with automatic updates enabled. What can you do to ensure the restart with the least amount of admin effort?", "o": [["Ask Human Resources to create and send out a company memo asking everyone to restart their devices within 24 hours.", false], ["Manually connect to each device using Chrome Remote Desktop and restart the device. After the device has started, start up the Chrome Browser, go to chrome://help to verify that the update has taken place.", false], ["In “User and Browser Settings”, under “Chrome Updates”, configure “Relaunch Notifications” to “Force relaunch after a period” and enter a time period in hours.", true], ["In the Admin console, in “Device Settings”, under “AutoUpdate Settings”, configure “Device Updates” to “Allow updates”.", false]], "need": 1}, {"q": "What are the two methods for signin in to a ChromeOS device?", "o": [["Single Sign-on", true], ["SMS Code sent to mobile phone", false], ["Google account username and password (with optional 2-factor)", true], ["Facebook Connect", false], ["Google Friend Connect", false]], "need": 2}, {"q": "You have been tasked to deploy shared devices using Managed Guest Sessions. Your IT policy requires blocking access to “google.com” at the parent organization. How would you prevent users from accessing “google.com” for all Managed Guest Sessions at the parent organization?", "o": [["Add “google.com” to “the blocked URL exceptions”.", false], ["Add “google.com” to “allow insecure content on these sites”.", false], ["Add “google.com” to “disallowed URLs in content settings”.", false], ["Add “google.com” to “the list of blocked URLs”.", true]], "need": 1}, {"q": "You need to create a recovery image on a USB stick. Which two steps should you take? Choose 2 answers", "o": [["Go to google.com/chromebooks.", false], ["Go to Google Play store.", false], ["Install Chrome Recovery Utility and download the image for the correct device model to a USB stick.", true], ["Go to Device Settings.", false], ["Go to Chrome Web Store on a Chrome device.", true]], "need": 2}, {"q": "The Finance Department is concerned about frequent Chromebook updates and asks you to explore a 6-month update cycle. Which update release option should you configure for these devices?", "o": [["LTS", true], ["Beta", false], ["Stable", false], ["Canary", false]], "need": 1}, {"q": "You need to enroll a device for an organization. What information would you need to provide first?", "o": [["Credentials to a Gmail account and the domain name that you will enroll the device in.", false], ["Credentials to any user account with enrollment permission belonging to the domain you will enroll the device in.", true], ["Only the domain name of the domain you will enroll the device in.", false], ["An activation key associated with the domain you will enroll the device in.", false]], "need": 1}, {"q": "You are enrolling several devices to send to a remote location. How can you ensure that these devices will automatically connect to the wireless network at the remote location when powered on for the first time?", "o": [["Use the Google Zero-Touch Enrollment (ZTE) process and generate the provisioning token by clicking on the “Enroll device” button in the Admin console “Devices” page.", false], ["During the enrollment process, add the wireless credentials manually to each device in the Admin console ensuring that they are applied to ChromeOS devices By User.", false], ["Add the wireless network credentials to the “Networks” section in the Admin console ensuring that they are applied to the ChromeOS devices By Device.", true], ["Add the wireless network credentials to the “Networks” section in the Admin console ensuring that they are applied to the ChromeOS devices By User.", false]], "need": 1}, {"q": "You have been tasked with selecting a 3rd party IdP to allow logging into ChromeOS devices. Your ChromeOS devices are displaying an ‘Unable to sign in to Google’ message. How should you troubleshoot this?", "o": [["Check Multi-Factor Authentication for the user account in the Google Admin console.", false], ["Disable the SSO connection in the Google Admin console.", false], ["Apply the SSO certificate to the ChromeOS device.", false], ["Ensure the identity provider is using an SAML compliant connection.", true]], "need": 1}, {"q": "Your customer is deploying ChromeOS devices in their environment and requires those ChromeOS devices to adhere to web filtering via TLS (or SSL) inspection. What recommendations should you make to your customer in setting up the requirements for ChromeOS devices?", "o": [["ChromeOS devices are preconfigured to adhere to company TLS (or SSL) inspection by default and can therefore be deployed with no additional configuration.", false], ["Configure a transparent proxy, set up your allowlist to use *.google.com, then verify TLS (or SSL) inspection is working.", false], ["Configure a hostname allowlist, set up a TLS (or SSL) certificate, then verify TLS (or SSL) inspection is working.", true], ["Reach out to Google Workspace Security and Compliance for tailored configurations for your customer.", false]], "need": 1}, {"q": "You want to enterprise enroll a device that has existing consumer accounts. What should you do first?", "o": [["Wipe the device.", true], ["Follow the same steps for enrolling a brand new device.", false], ["Delete all consumer accounts, and then follow the same steps for enrolling a brand new device.", false], ["Contact Google support to convert the device into an enterprise device.", false]], "need": 1}, {"q": "Your administration team is about to deploy a fleet of ChromeOS devices. Your users have their own peripherals and you would like them to use what they have if possible. You also would like to let your users know what peripherals work and what peripherals do not. What should you do for your users?", "o": [["Send them all new peripherals and have your users send in their old equipment even if the old equipment works.", false], ["Tell your users that every peripheral works with ChromeOS.", false], ["Tell your users to try what they have and to start an IT support ticket if something isn’t working right.", false], ["Create Change Management documentation that provides them with information on how to check their current peripherals and instructions on how to get new equipment.", true]], "need": 1}, {"q": "You need to schedule automatic device reboots for all digital signage ChromeOS devices on a weekly basis. You have set up a “Digital Signage” child organization to customize your kiosk device policies for this deployment. How would you enforce scheduled reboots for your digital signage devices every Friday?", "o": [["In the “Digital Signage” child organization, disable scheduled reboots except on Friday.", false], ["In the “Digital Signage” child organization, set the policy to always reboot on Friday on user sign-out.", false], ["In the “Digital Signage” child organization, apply reboot after the uptime limit on Friday.", false], ["In the “Digital Signage” child organization, set the policy to enable scheduled reboots on Friday.", true]], "need": 1}, {"q": "You are setting up ChromeOS devices in a public library and need to prevent you ChromeOS devices from sleeping when not in use. How would you set up your policy to achieve this?", "o": [["In “User & Browser Settings” for Power and shutdown, set the policy to “Do not allow wake locks.”", false], ["In “Power management settings”, apply “Do not allow device to sleep/shut down when idle on the sign-in screen.”", true], ["In “Power management settings”, set the policy to “Only allow users to turn off the device using the physical power button.”", false], ["In “Managed Guest Session settings”, set the maximum user session length to “unlimited.”", false]], "need": 1}, {"q": "You are tasked with reducing the risk of a breach of your organization’s identities. What should you do to minimize the risk?", "o": [["Configure individual Google Accounts.", false], ["Set up Single Sign-On (SSO).", true], ["Set up Client-side encryption.", false], ["Connect your LDAP.", false]], "need": 1}, {"q": "You are using a third-party service for SSO. Users are confused when signing onto a Chrome device because they are asked for Google accounts details before being redirected to the sign-in screen for your SSO provider. Which settings must be changed so managed devices open the SSO provider login page by default.", "o": [["Signle sign-on cookie behaviour", false], ["SAML single sign-on login frequency", false], ["SAML single sign-on password synchronization flows", false], ["Single sign-on IdP redirection", true]], "need": 1}, {"q": "You have been asked to explain the built-in security features of ChromeOS. What is the benefit of having verified boot enabled on a ChromeOS device?", "o": [["It installs the known safe backup OS every time the device is started up.", false], ["It ensures that the OS is uncompromised.", true], ["It allows updates to happen in the background.", false], ["Running both operating systems on one device at the same time makes it twice as powerful.", false]], "need": 1}, {"q": "Your organization is buying new ChromeOS devices to replace older devices. You are receiving these devices and need to dispose of them responsibly. What should you do to each of these devices before disposing of them?", "o": [["Suspend the devices", false], ["Disable the devices", false], ["Deprovision the devices", true], ["Factory reset the devic", false]], "need": 1}, {"q": "You’re the lead for the technology department and you're working with your teammate on a hardware refresh in the upcoming year.", "o": [["major part of the refresh is to consider ChromeOS devices for the majority of the users in the company. What are some organization level objectives you should consider during this hardware refresh in regard to ChromeOS? A. ChromeOS will need a rollout and execution plan commensurate with hardware supply availability.", false], ["Verifying if all the terms and conditions in the Chrome Online Agreement are applicable to ChromeOS.", false], ["ChromeOS allows for advanced security, flexible access, and simplified orchestration within the business.", true], ["ChromeOS integration with current technological standards and practices can be worked on with trusted Google partners.", false]], "need": 1}, {"q": "As your organization’s administrator, you want to assign a delegated admin custom role in order to perform a limited set of ChromeOS device management tasks only for the Marketing organizational unit. What should you do?", "o": [["Create and assign a custom role with “Chrome Management permissions” for the Marketing devices OU.", true], ["Create and assign a super admin role.", false], ["Create and assign a custom role with “Chrome Management permissions” for the Marketing Users OU.", false], ["Create and assign a custom role with “Chrome Management permissions” for the root OU.", false]], "need": 1}, {"q": "Your team has members that work remotely. Your CTO would like to verify that your fleet of ChromeOS devices remains managed by corporate policy even after a device wipe. What would you configure to complete this objective?", "o": [["Set up the Admin console to force the device to automatically re-enroll after wiping.", true], ["Edit the setting “Verified Access”. Set this setting to “Require verified mode for boot for verified access”.", false], ["Create strict password rules.", false], ["Set the setting “Powerwash” to “Do not allow powerwash to be triggered”.", false]], "need": 1}, {"q": "One of the employees of the organization you’re managing is leaving, and you want to prepare the device they’ve been using for adoption by a new user. What is the recommended action you need to take through the Admin console to remove any previous user data from the machine?", "o": [["Deprovision the device, reset it, and then finally re-enroll it.", true], ["Delete the user from the Admin console and powerwash the machine.", false], ["Select “Reset” on the devices overview page, and then “Clear User Profiles.”", false], ["Enable forced-reenrollment on the device OU and then factory reset the device.", false]], "need": 1}, {"q": "A customer has a mission-critical workload running on ChromeOS and needs devices configured to reduce ChromeOS changes. How can an admin reduce the risk of an unexpected change in an OS update affecting the customer’s entire ChromeOS device domain while maintaining security and minimizing admin workload?", "o": [["Move to a Long-term Support channel.", true], ["Force auto reboot after update.", false], ["Add an update rollout plan.", false], ["Enable variations.", false]], "need": 1}, {"q": "Your users are concerned that their ChromeOS devices are not updated. Where can you tell your users to go to that will show the user their current version and allow your users to update to the latest version in the safest manner possible?", "o": [["Have your users install diagnostics apps from the Chrome Web store to show device data.", false], ["Have your users open the Chrome Browser and type in chrome://help in the address bar.", false], ["Have your users open the Chrome Browser and type in chrome://version in the address bar.", false], ["Have your users enter the “Device Settings” area and click on “About ChromeOS.”", true]], "need": 1}, {"q": "You want to enterprise-enroll a device that has previously been signed in to. What should you do first?", "o": [["Contact Google support to convert the device into an enterprise device.", false], ["Follow the same steps for enrolling a brand new device.", false], ["Wipe the device.", true], ["Delete all consumer accounts, and then follow the same steps for enrolling a brand new device.", false]], "need": 1}, {"q": "You’re in charge of deploying video conferencing equipment and it has been decided that you will leverage ChromeOS devices. What initial considerations should you make when deciding on devices?", "o": [["Devices must have 8GB of RAM and obey supported processor models.", false], ["Deploying instructional guides to all users on setup, configuration, and use of new equipment.", false], ["A form factor compatible for both remote and site workers is required.", true], ["A precise time window on how to apply security patches and updates to all devices.", false]], "need": 1}, {"q": "You are a ChromeOS Administrator of a school district. While working with a teacher in one of the schools, they mention they are having issues downloading files on their ChromeOS device. What are some ways you can help troubleshoot with the least amount of disruption to the user?", "o": [["Reser the user’s ChromeOS device to its original factory settings.", false], ["Check for the system updates. If any updates are available, install them.", false], ["Run Diagnostics from the ChromeOS device to the troubleshoot.", false], ["Check how much storage is being used on the device, then delete or move files that aren’t needed anymore.", true]], "need": 1}, {"q": "At a specific location in your organization, pusers cannot log in to their ChromeOS devices. The ChromeOS Administrator has also noticed that devices have not synced in the past 24 hours. You have updated policies in the Admin console for your fleet of ChromeOS devices, but the devices are not getting the updated policies. What is a probable change in the environment that can cause these issues?", "o": [["Your network administrator has blocked all network traffic to Google services.", true], ["A different location enrolled a large number of new devices.", false], ["Your organization’s licenses have recently expired.", false], ["Your root Certificate Authority expired.", false]], "need": 1}, {"q": "You are migrating an organization from Windows devices. Part of the migration process involves setting up the existing suite of business applications for use with ChromeOS, leveraging cloud technologies whenever possible. Which of these would be the preferred option when choosing the type of solution to deploy?", "o": [["Check to see if there’s a web application equivalent that provides all the necessary features, and if so, deploy the URL through the Admin console.", true], ["Deploy the legacy client in a virtualization solution, and use that to stream the application to the ChromeOS devices.", false], ["Write a tutorial on how to install each of the applications using the Linux terminal, and ask users to follow those instructions when first using their new device.", false], ["Go to the Google Play Store and deploy the Android client of the app in question.", false]], "need": 1}, {"q": "You are managing the “Customer Kiosk” child organization and need to pin devices to maintain stability and security. How would you configure your Chrome update settings to achieve this?", "o": [["Long-term Support channel.", true], ["Choose the “Beta channel.\"", false], ["Long-term Support Candidate channel.", false], ["Select the “Stable channel.\"", false]], "need": 1}, {"q": "As the ChromeOS Administrator, you have been given previously used devices by another organization that have been used, but do not know the current management state of the devices. When are you required to wipe a device before enrolling it? Choose 2 answers", "o": [["When a replacement device is sent from an OEM to replace a defective device.", false], ["When the device has been purchased from an authorized reseller.", false], ["When the device has been signed in to by a user before enrolling it.", true], ["When the device has been previously enrolled in a different domain.", true], ["When the device has been sitting in a warehouse for more than 90 days.", false]], "need": 2}, {"q": "The security department has been informed that a ChromeOS device was stolen out of an employee's car. What should you do in the Admin console to ensure the device is rendered inoperable while still maintaining management of the device?", "o": [["Deprovision the ChromeOS device.", false], ["Tag the ChromeOS device as stolen.", false], ["Disable the ChromeOS device.", true], ["Powerwash the ChromeOS device.", false]], "need": 1}, {"q": "How should an administrator configure Google Admin policies to ensure a device maintains enterprise management to the tenant after a remote factory reset?", "o": [["Enable Powerwash.", false], ["Enable Guest Mode.", false], ["Enable forced re-enrollment.", true], ["Disable Verified Mode.", false]], "need": 1}, {"q": "The security team needs to ensure that the latest ChromeOS updates are deployed and applied to all ChromeOS devices in your organization. You have already configured the Updates Policies in the Admin console appropriately so updates are downloaded daily. How would you ensure daily updates are installed on all ChromeOS devices while minimizing end user impact?", "o": [["Set the “Auto Reboot” after Update Policy.", true], ["Configure “Enforce Updates.”", false], ["Enable “Reboot” after uptime limit.", false], ["Configure “Relaunch Notifications.”", false]], "need": 1}, {"q": "Your network administrator wants to block Google services traffic. What is the result?", "o": [["Chrome devices will not be able to reach Google", true], ["Google Search will not work.", false], ["Chrome devices will crash", false], ["Nothing. This isn’t an issue.", false]], "need": 1}, {"q": "Your leadership team would like to verify that all ChromeOS devices are restarted to apply the new update as quickly as possible. You have 2000 devices and your Admin console is configured with automatic updates enabled. What can you do to ensure the restart with the least amount of admin effort?", "o": [["In the Admin console, in “Device Settings”, under “AutoUpdate Settings”, configure “Device Updates” to “Allow updates”.", false], ["Manually connect to each device using Chrome Remote Desktop and restart the device. After the device has started, start up the Chrome Browser, go to chrome://help to verify that the update has taken place.", false], ["Ask Human Resources to create and send out a company memo asking everyone to restart their devices within 24 hours.", false], ["In “User and Browser Settings”, under “Chrome Updates”, configure “Relaunch Notifications” to “Force relaunch after a period” and enter a time period in hours.", true]], "need": 1}, {"q": "In line with Google's best practice recommendations, you need to configure an OU of devices to run on an early release of ChromeOS so that users can test new features and verify functionality. Which policy option should you choose?", "o": [["Canary", false], ["LTS", false], ["Stable", false], ["Beta", true]], "need": 1}, {"q": "A ChromeOS Administrator has deployed ChromeOS devices in their organization. How can the company evaluate the compatibility with future updates following Google’s best practices while still gaining access to new features when they launch?", "o": [["Enable “Auto Updates” on all devices on the “Stable channel”, but let the employees in the IT department run their devices on the “Beta channel” so they have time to evaluate and adapt the environment to each update before it reaches Stable.", false], ["Set the entire fleet to update in accordance with the “Long-term Support (LTS) channel”.", false], ["Disable “Auto Updates” on all devices and let the admin test the newest release on the “Stable channel” on their own device before rolling it out organization-wide.", false], ["Set 5% of the organization across several departments on the “Beta channel”, and configure the rest of the fleet to receive 5%auto updates on the “Stable channel”.", true]], "need": 1}, {"q": "You have a number of applications that you rely upon in your organization. You want to ensure that your applications continue to run smoothly with each new version of ChromeOS. What should you do?", "o": [["Ask users to provide feedback on the applications within a week of a new Chrome release.", false], ["Always install the latest version of those applications when they become available so they are always compatible with the latest version of Chrome.", false], ["Implement a QA strategy and put their IT group and 5% of users on the beta channel of ChromeOS so they can find and report bugs early for upcoming ChromeOS releases.", true], ["Advise them to take no action. All applications are automatically supported on the latest version of Chrome.", false]], "need": 1}, {"q": "How would you deploy your “Terms of Services” page to all managed ChromeOS devices?", "o": [["Go to “User & Browser” and “Managed Guest Session” settings to upload your terms of service.", true], ["Navigate to “User & Browser” and “Managed Guest Session” settings to upload your custom avatar.", false], ["Navigate to “Chrome Verified Access” and enable the policy for content protection.", false], ["In “User & Browser Settings”, upload the “Terms of Service” as a wallpaper.", false]], "need": 1}, {"q": "How do you validate Chrome policies on a managed device?", "o": [["Go to the admin console and look up the policies", false], ["In the browser go to chrome://policy to confirm that the device is receiving both user and device policy", true], ["Download device logs", false], ["In the browser go to policy://chrome to confirm that the device is receiving both user and device policy.", false]], "need": 1}, {"q": "You are planning to purchase some new ChromeOS devices for your sales team and want to use Zero-Touch Enrollment (ZTE). You want the new devices to be directly enrolled into an organization unit named ‘Sales Devices.’ How do you generate the correct ZTE Token in the Admin console with the least amount of admin effort?", "o": [["From the “ChromeOS devices” page select the “Sales Devices” organization unit. Click on the “Enroll devices” button followed by the “Generate token” button to generate the ZTE token.", true], ["Contact your Google Partner to request the ZTE token. You will need to specify that the ZTE token is to be applied to the Sales Devices organization unit.", false], ["At the “ChromeOS devices” page, click on the “Enroll devices” button and navigate to the “ChromeOS tokens” page.", false], ["Click on the “Enroll devices” button followed by the “Generate token” button from the “ChromeOS devices” page. Once the devices have been enrolled, you can move them into the Sales Devices organization unit.", false]], "need": 1}, {"q": "You want to apply a set of device policies across multiple organizational units (OUs). What should you do?", "o": [["Use the Directory API to create the policies in each OU.", false], ["Create a higher level OU where the policies can be applied, then rely on inheritance to propagate the policies to the other OUs.", true], ["Create the set of policies in one OU, then use copy and paste to set those policies in the other OUs.", false], ["Export the device list from one OU to a CSV file, then use Google Apps Directory Sync to import your new policies to other OUs.", false]], "need": 1}, {"q": "Which feature of the Google Admin console allows you to restrict devices from remembering user passwords?", "o": [["WebAuthn", false], ["Password Manager", true], ["Security Token Removal", false], ["Enrollment Permissions", false]], "need": 1}, {"q": "Your organization has automatic ChromeOS updates implemented. Your CTO would like to review the documentation on what changes each new version has. How would you assist your CTO in accomplishing this goal?", "o": [["Have your CTO start a Google Chrome Support ticket.", false], ["Search YouTube for Chrome Update stories.", false], ["Direct your CTO to the “Chrome Release Notes Support” page.", true], ["Open Chrome and enter chrome://updates in the address bar.", false]], "need": 1}, {"q": "How should an admin update hundreds of users’ identities quickly with the Admin console?", "o": [["Manually update each user.", false], ["Change primary domain.", false], ["Bulk upload users through a CSV file.", true], ["Create a new user account for each user.", false]], "need": 1}, {"q": "You need to get to the enterprise
